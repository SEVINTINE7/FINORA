plugins {
    id 'com.android.application' version '9.3.0'
}

def releaseApi = providers.environmentVariable('FINORA_RELEASE_API_URL').orElse('').get()
if (!releaseApi.isEmpty()) {
    def uri = URI.create(releaseApi)
    if (uri.scheme != 'https' || !uri.host || uri.rawUserInfo != null ||
            uri.rawQuery != null || uri.rawFragment != null || uri.rawPath != '/') {
        throw new GradleException('FINORA_RELEASE_API_URL must be an HTTPS origin with path / and no credentials, query or fragment')
    }
}

android {
    namespace 'lk.finora.app'
    compileSdk 37

    defaultConfig {
        applicationId 'lk.finora.app'
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName '0.1.0'
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions += 'advice'
    productFlavors {
        beta {
            dimension 'advice'
            applicationIdSuffix '.beta'
            buildConfigField 'String', 'ADVICE_MODE', '"BETA"'
        }
        v1 {
            dimension 'advice'
            buildConfigField 'String', 'ADVICE_MODE', '"V1"'
        }
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'API_BASE_URL', '"http://10.0.2.2:8080/"'
        }
        release {
            buildConfigField 'String', 'API_BASE_URL', groovy.json.JsonOutput.toJson(releaseApi)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.security:security-crypto:1.1.0'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.13.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
