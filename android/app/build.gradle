plugins {
    id 'com.android.application' version '9.3.0'
}

def releaseApi = providers.environmentVariable('FINORA_RELEASE_API_URL').orElse('').get()
if (!releaseApi.isEmpty()) {
    def uri = URI.create(releaseApi)
    if (uri.scheme != 'https' || !uri.host || uri.rawUserInfo != null ||
            uri.rawQuery != null || uri.rawFragment != null || uri.rawPath != '/') {
        throw new GradleException('FINORA_RELEASE_API_URL must be an HTTPS origin with path / and no credentials, query or fragment')
    }
}

// T56.5 Release signing. The keystore lives outside the repo (never in Git) and is
// passed in by env vars. Without FINORA_KEYSTORE_FILE, release builds stay unsigned.
def env = { String name -> providers.environmentVariable(name).orElse('').get() }
def releaseKeystore = env('FINORA_KEYSTORE_FILE')
if (!releaseKeystore.isEmpty()) {
    def missing = ['FINORA_KEYSTORE_PASSWORD', 'FINORA_KEY_ALIAS', 'FINORA_KEY_PASSWORD'].findAll { env(it).isEmpty() }
    if (!missing.isEmpty()) {
        throw new GradleException("Release signing needs: ${missing.join(', ')}")
    }
    if (!new File(releaseKeystore).isFile()) {
        throw new GradleException("FINORA_KEYSTORE_FILE not found: ${releaseKeystore}")
    }
    if (releaseApi.isEmpty()) {
        throw new GradleException('Signed release builds need FINORA_RELEASE_API_URL (the server HTTPS URL)')
    }
}

android {
    namespace = 'lk.finora.app'
    compileSdk 37

    defaultConfig {
        applicationId 'lk.finora.app'
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'lk.finora.app.data.local.SessionVerificationInstrumentation'
    }

    buildFeatures {
        buildConfig = true
    }

    flavorDimensions += 'advice'
    productFlavors {
        v1 {
            dimension 'advice'
            buildConfigField 'String', 'ADVICE_MODE', '"V1"'
        }
    }

    signingConfigs {
        if (!releaseKeystore.isEmpty()) {
            release {
                storeFile new File(releaseKeystore)
                storePassword env('FINORA_KEYSTORE_PASSWORD')
                keyAlias env('FINORA_KEY_ALIAS')
                keyPassword env('FINORA_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'API_BASE_URL', '"http://127.0.0.1:8080/"'  // D22: phone/emulator reach the laptop API via adb reverse tcp:8080 tcp:8080
        }
        release {
            if (!releaseKeystore.isEmpty()) {
                signingConfig signingConfigs.release
            }
            buildConfigField 'String', 'API_BASE_URL', groovy.json.JsonOutput.toJson(releaseApi)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.security:security-crypto:1.1.0'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.13.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
