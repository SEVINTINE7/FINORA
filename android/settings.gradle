pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven { url = uri('https://jitpack.io') }
            }
            filter { includeModule('com.github.PhilJay', 'MPAndroidChart') }
        }
    }
}
rootProject.name = 'FINORA'
include ':app'
