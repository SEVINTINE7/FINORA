name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: finora_test
          MYSQL_USER: finora
          MYSQL_PASSWORD: finora
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/finora_test
      TEST_DB_USER: finora
      TEST_DB_PASS: finora
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x mvnw
      # T50.2/T50.3: tests on MySQL 8 + JaCoCo report; fails below 70% line coverage on services
      - run: ./mvnw -B verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: api/target/site/jacoco/
          if-no-files-found: warn
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: api/target/surefire-reports/

  android:
    name: Android builds and unit tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'
      - run: chmod +x gradlew
      - run: ./gradlew assembleV1Debug testV1DebugUnitTest
