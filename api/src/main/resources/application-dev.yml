# Local development. DB defaults match api/scripts/create-local-db.sql (local only, D14).
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/finora}
    username: ${DB_USER:finora}
    password: ${DB_PASS:finora}

finora:
  jwt:
    # Dev-only fallback so the app starts locally; set JWT_SECRET for anything shared
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789abcdef}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
