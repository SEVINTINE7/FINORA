spring.application.name=finora-api

# Database: local defaults for development; override with env vars (T04 adds full dev/test/prod profiles)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/finora}
spring.datasource.username=${DB_USER:finora}
spring.datasource.password=${DB_PASS:finora}

# Flyway owns the schema (migrations in db/migration, added in T03); Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
