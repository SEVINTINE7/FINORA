# T56.3 · HTTPS reverse proxy for the FINORA API. server-setup.sh replaces __DOMAIN__.
# Port 80 is closed by the firewall, so there is no HTTP server block.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:FinoraSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # CSV import is limited to 1 MB (T12.4); allow a little multipart overhead
    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
    }

    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080;
    }

    # Nothing else is exposed
    location / {
        return 404;
    }
}
